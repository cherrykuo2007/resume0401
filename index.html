<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人履歷 - 郭千郁</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f1ed;
            color: #4a4a4a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px; 
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            background: #ffffff;
            padding: 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 25px;
            border: 3px solid #bfa37a;
        }

        .header h1 { margin: 0; color: #bfa37a; font-size: 28px; }
        .header p { margin: 5px 0 0; color: #888; }

        .section {
            background: #ffffff;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            border-left: 5px solid #bfa37a;
            padding-left: 12px;
            font-size: 20px;
            margin-top: 0;
            color: #5d534a;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            background: #bfa37a;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .skill-bar {
            background: #eee;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .skill-bar span {
            display: block;
            height: 100%;
            background: #bfa37a;
        }

        /* 底部連結樣式 */
        .footer-source {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            padding-bottom: 20px;
        }

        .footer-source a {
            color: #bfa37a;
            text-decoration: none;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            .header { flex-direction: column; text-align: center; }
            .header img { margin-right: 0; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="bg.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="header">
        <img src="images/photo.jpg" alt="個人照片">
        <div>
            <h1 id="name">郭千郁</h1>
            <p id="title">大學生 / 創作者</p>
        </div>
    </div>

    <div class="section">
        <h2>自我介紹</h2>
        <p id="about">學號114018050，我是一位對設計與創作充滿熱情的學生，目前就讀於亞洲大學，喜歡探索不同領域並持續成長。</p>
