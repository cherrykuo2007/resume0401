<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f5f6fa;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    overflow: hidden;
}

.header {
    display: flex;
    align-items: center;
    padding: 30px;
    background: #2f3640;
    color: white;
}

.header img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
    border: 3px solid white;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 5px 0 0;
    opacity: 0.8;
}

.section {
    padding: 25px 30px;
    border-bottom: 1px solid #eee;
}

.section h2 {
    margin-bottom: 15px;
    color: #2f3640;
}

.skill-bar {
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
}

.skill-bar span {
    display: block;
    height: 10px;
    background: #40739e;
}

.button {
    display: inline-block;
    padding: 10px 15px;
    background: #40739e;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <img src="images/photo.jpg" alt="個人照片">
        <div>
            <h1 id="name">郭千郁</h1>
            <p id="title">大學生 / 創作者</p>
        </div>
    </div>

    <div class="section">
        <h2>自我介紹</h2>
        <p id="about">我是一位對設計與創作充滿熱情的學生，喜歡探索不同領域並持續成長。</p>
        <div class="button" onclick="editAbout()">修改內容</div>
    </div>

    <div class="section">
        <h2>學歷</h2>
        <ul>
            <li>亞洲大學（就讀中）</li>
        </ul>
    </div>

    <div class="section">
        <h2>技能</h2>
        <p>HTML</p>
        <div class="skill-bar"><span style="width:80%"></span></div>
        <p>CSS</p>
        <div class="skill-bar"><span style="width:75%"></span></div>
        <p>JavaScript</p>
        <div class="skill-bar"><span style="width:70%"></span></div>
    </div>

    <div class="section">
        <h2>聯絡方式</h2>
        <p>Email: example@email.com</p>
        <p>Phone: 0912-345-678</p>
    </div>
</div>

<script>
function editAbout() {
    let newText = prompt("請輸入新的自我介紹：");
    if(newText) {
        document.getElementById("about").innerText = newText;
    }
}
</script>

</body>
</html>
